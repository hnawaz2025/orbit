<!doctype html>
<meta charset="utf-8">
<title>Orbit — scan card</title>
<!--
  Printable card for the conference floor. Open in a browser and print, or
  print two-up on A4 and cut. Deliberately plain: this is read from a metre
  away by someone walking past, so it carries a QR, one line saying what it
  is, and the URL for anyone whose camera will not focus.
-->
<style>
  :root { --ink: #10161D; --muted: #4E5C6A; --accent: #0B5D75; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font: 16px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-wrap: wrap; gap: 8mm; padding: 10mm;
  }
  .card {
    width: 95mm; height: 130mm; border: 1.5pt solid var(--ink);
    border-radius: 4mm; padding: 8mm 7mm;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    page-break-inside: avoid;
  }
  .kicker { font-size: 9pt; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-size: 21pt; line-height: 1.1; margin: 3mm 0 2mm; letter-spacing: -.01em; }
  .sub { font-size: 10.5pt; color: var(--muted); margin: 0 0 5mm; }
  .qr { width: 58mm; height: 58mm; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .url { margin-top: 4mm; font-size: 10pt; font-weight: 600; word-break: break-all; }
  .foot { margin-top: auto; font-size: 8.5pt; color: var(--muted); }
  /* Quieter than the URL above it: whoever built it matters less than what
     it does, right up until someone has decided it was useful. */
  .maker { margin-top: 2mm; font-size: 7.5pt; color: var(--muted); }
  @page { margin: 8mm; }
  @media print { body { padding: 0; } }
</style>

  <div class="kicker">API World 2026</div>
